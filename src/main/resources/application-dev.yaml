spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
app:
  cookie:
    secure: ${COOKIE_SECURE:false} # dev is plain HTTP; a Secure cookie is never replayed
websiteUrl: ${WEBSITE_URL:http://localhost:4242}
